### Thinking Process Guidance(MANDATORY):
Before generating the YAML output, you must write a Detailed Analysis section. Do not skip this.
For each uncovered path/branch in the target method, perform Constraint Solving:

1. **Locate the Branch**: Identify the specific line number and condition (e.g., if (x > 5 && y == null)).

2. **Solve Constraints**: Reverse-engineer the input data required to satisfy this condition.
  
  - Ask yourself: "What value must registry have? What state must the pattern string be in?"
  - Example: "To hit the else block at line 45, registry must be non-null, but registry.get(x) must return null."

3. **Plan the Test**:
  - Setup: How do I construct these objects using existing helpers in {{ test_file_name }}?
  - Assertion: What happens when this path is taken? (Exception thrown? Return value changes?)

### Example Thinking Process (Applied to a complex path):
*Target*: Cover the `else` block of `if (config.isValid() || forced)` where `forced` is false.
1. **Constraints**: `config` must not be null. `config.isValid()` must return `false`. `forced` boolean must be `false`.
2. **Input**: Create a `Config` object. Call `setValid(false)`. Pass `false` as the second argument.
3. **Existing Context**: `TestHelper.createBasicConfig()` exists in the test file. I will use it.
4. **Outcome**: The method should throw `ConfigurationException`.

You should analyze the uncovered paths one by one, state the reason they are uncovered (key variables and critical branch nodes), and then generate unit tests.

Only after completing this thinking process should you proceed to write the tests.

