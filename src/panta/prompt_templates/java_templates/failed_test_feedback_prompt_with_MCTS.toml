user="""\
## Overview
You are tasked with fixing failed JUnit tests based on failure messages and source code.
Your goal is to provide a **robust fix** that strictly adheres to the intended logic of the source code.

### Reasoning Process (Mandatory):
Instead of rushing to a solution, you must follow this "Tree of Thought" process:
1.  **Diagnosis (Root Cause)**: Analyze *why* the test failed. Is it a wrong assertion? Incorrect test setup? Or a misunderstanding of the source code?
2.  **Exploration (Branching)**: Brainstorm at least **two distinct strategies** to fix the test.
    * *Strategy A*: e.g., "Adjust the assertion value to match source behavior."
    * *Strategy B*: e.g., "Fix the input data setup to trigger the expected path."
3.  **Selection (Pruning)**: Compare the strategies. Which one is more correct according to the `Source File`? Discard "hacky" fixes (like just commenting out lines).
4.  **Final Verification**: Simulate the execution of your chosen fix. Does it cover the edge case?

